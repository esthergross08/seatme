<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#F7F3EA" />
  <title>SeatMe — You're offline</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #F7F3EA; color: #221F2B;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      text-align: center;
    }
    main { max-width: 340px; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-family: Fraunces, Georgia, "Times New Roman", serif; font-weight: 500; font-size: 26px; margin: 20px 0 8px; }
    p { color: #736D5F; line-height: 1.5; margin: 0 0 24px; font-size: 15px; }
    button {
      appearance: none; border: 0; border-radius: 999px; cursor: pointer;
      background: #221F2B; color: #F7F3EA; font: inherit; font-weight: 600;
      padding: 12px 28px; font-size: 15px;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>SeatMe needs a connection to load and save your seating plans. Check your Wi-Fi or mobile data and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
